<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11110f" />
    <meta name="description" content="A quiet personal productivity workspace." />
    <link rel="icon" type="image/png" href="/icons/app-icon.png" />
    <link rel="apple-touch-icon" href="/icons/app-icon.png" />
    <script>
      ;(() => {
        const stored = localStorage.getItem('app-theme') || 'system'
        const dark = stored === 'dark' || (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.themePreference = stored
      })()
    </script>
    <title>Foxsit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
